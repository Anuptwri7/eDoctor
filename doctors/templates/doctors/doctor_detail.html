{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ doctor.name }} - Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f7f7f7; font-family: Arial, sans-serif; }
        .card { max-width: 500px; margin: 50px auto; padding: 20px; border-radius: 16px; background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
        .doctor-img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="card text-center">
        {% if doctor.image %}
            <img src="{{ doctor.image.url }}" alt="{{ doctor.name }}" class="doctor-img mb-3">
        {% endif %}
        <h2>{{ doctor.name }}</h2>
        <p><strong>Department:</strong> {{ doctor.department.name }}</p>
        <p><strong>Contact:</strong> {{ doctor.contact_number }}</p>
        <a href="{% url 'start_checkup' %}" class="btn btn-primary mt-3">Back to Checkup</a>
    </div>
</body>
</html>
