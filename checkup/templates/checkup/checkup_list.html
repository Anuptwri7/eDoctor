<!DOCTYPE html>
<html>
<head>
    <title>Your Checkups</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container">
    <h2 class="mb-4 text-primary">Your Checkups</h2>

    {% for checkup in checkups %}
    <a href="{% url 'checkup_detail' checkup.pk %}" class="text-decoration-none">
        <div class="card mb-3 p-3 shadow-sm">
            <h5 class="text-dark">Checkup #{{ checkup.id }}</h5>
            <p class="text-muted mb-0">{{ checkup.created_at|date:"D, M d Y H:i" }}</p>
        </div>
    </a>
    {% empty %}
        <p>No checkups found.</p>
    {% endfor %}
</div>
</body>
</html>
