{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediGuide Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&display=swap" rel="stylesheet">

<style>
/* ---------------- BACKGROUND ---------------- */
body {
    background: transparent;
    font-family: 'Roboto', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
}

/* BACKGROUND BANNER */
.bg-carousel {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: -1; /* behind everything */
    overflow: hidden;
}

.bg-carousel img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    opacity: 0;
    transition: opacity 1.3s ease-in-out;
}

.bg-carousel img.active {
    opacity: 1;
}

/* ---------------- DASHBOARD CARD ---------------- */
.dashboard-supercard {
    width: 450px;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 25px;
    padding: 40px 32px;

    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    box-shadow:
        0 20px 40px rgba(0,0,0,0.25),
        0 0 40px rgba(0,150,255,0.1);

    text-align: center;
    animation: fadeIn 0.7s ease-out;
}

.dashboard-header h2 {
    font-size: 32px;
    color: #2c3e50;
    font-weight: 800;
}

.dashboard-header .sub-text {
    color: #ff9f43;
    font-weight: 600;
    font-size: 14px;
}

.supercard-stats {
    display: flex;
    justify-content: space-between;
    margin: 40px 0;
}

.supercard-stat {
    width: 48%;
    padding: 20px;
    background: rgba(255,255,255,0.4);
    border-radius: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    transition: transform .2s ease, box-shadow .2s ease;
}

.supercard-stat:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}

.supercard-stat h3 {
    font-size: 28px;
    font-weight: 700;
    margin-top: 10px;
}

.supercard-stat p {
    font-size: 14px;
    color: #555;
}

.stat-icon {
    width: 60px;
    height: 60px;
    margin: 0 auto;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 26px;
    color: white;
    margin-bottom: 10px;
}

.bg-blue { background: #4A90E2; }
.bg-green { background: #2ecc71; }

.dashboard-actions .btn-lg {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    margin-top: 12px;
    font-size: 18px;
    font-weight: bold;
    text-decoration: none;
    color: white;
    transition: transform .2s ease;
}

.dashboard-actions .btn-lg:hover {
    transform: translateY(-4px);
}

.btn-lg.primary { background: #4A90E2; }
.btn-lg.success { background: #2ecc71; }
.btn-lg.danger  { background: #e74c3c; }

@keyframes fadeIn {
    from { opacity: 0; transform: translate(-50%, -45%); }
    to { opacity: 1; transform: translate(-50%, -50%); }
}


/* ---------------- FLOATING CHAT BUTTON ---------------- */
.floating-chat-btn {
    position: fixed;
    bottom: 22px;
    right: 22px;
    background: #4A90E2;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(0,0,0,0.25);
    transition: 0.25s;
    z-index: 9999;
}

.floating-chat-btn:hover {
    transform: scale(1.08);
    background: #357ABD;
}

/* ---------------- CHAT WIDGET ---------------- */
.chat-modal {
    position: fixed;
    bottom: 95px;
    right: 22px;
    width: 360px;
    height: 500px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.25);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 9999;
    animation: popupAnim 0.25s ease-out forwards;
}

@keyframes popupAnim {
    from { transform: translateY(20px) scale(0.9); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
}

.chat-modal.active {
    display: flex !important;
}

.chat-header {
    background: linear-gradient(135deg, #4A90E2, #357ABD);
    padding: 15px;
    color: white;
    text-align: center;
    position: relative;
}

.chat-close {
    background: none;
    border: none;
    position: absolute;
    right: 16px;
    top: 8px;
    font-size: 22px;
    color: white;
    cursor: pointer;
}

#chat-box {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    background: #f7f9fb;
}

.msg {
    max-width: 80%;
    padding: 10px 16px;
    margin: 8px 0;
    border-radius: 18px;
    font-size: 15px;
}

.user {
    background: #DCF8C6;
    align-self: flex-end;
    margin-left: auto;
}

.bot {
    background: white;
    border: 1px solid #e6e6e6;
    align-self: flex-start;
}

.input-area {
    display: flex;
    padding: 12px;
    border-top: 1px solid #ddd;
    background: white;
}

#message {
    flex: 1;
    padding: 12px;
    border-radius: 18px;
    border: 1px solid #ccc;
}

#send-btn {
    margin-left: 10px;
    border: none;
    padding: 12px 18px;
    border-radius: 18px;
    background: #4A90E2;
    color: white;
    cursor: pointer;
}
</style>

</head>
<body>

<!-- BACKGROUND BANNER -->
<div class="bg-carousel">
    {% for banner in banners %}
        <img src="{{ banner.image.url }}" class="{% if forloop.first %}active{% endif %}">
    {% endfor %}
</div>

<!-- DASHBOARD -->
<div class="dashboard-supercard">

    <div class="dashboard-header">
        <h2>MediGuide</h2>
        <p>Welcome, {{ request.user.username }}!<br>
        <span class="sub-text">Manage your health easily.</span></p>
    </div>

    <div class="supercard-stats">

        <div class="supercard-stat">
            <a href="{% url 'checkup_list' %}">
                <div class="stat-icon bg-blue"><i class="fas fa-notes-medical"></i></div>
                <h3>{{ total_checkups }}</h3>
                <p>Total Checkups</p>
            </a>
        </div>

        <div class="supercard-stat">
            <div class="stat-icon bg-green"><i class="fas fa-user-md"></i></div>
            <h3>{{ total_doctors }}</h3>
            <p>Doctors</p>
        </div>

    </div>

    <div class="dashboard-actions">
        <a href="{% url 'start_checkup' %}" class="btn-lg primary">Start Checkup</a>
        <a href="{% url 'view_doctors' %}" class="btn-lg success">View Doctors</a>
        <a href="{% url 'logout' %}" class="btn-lg danger">Logout</a>
    </div>

</div>


<!-- FLOATING CHAT BUTTON -->
<div class="floating-chat-btn" onclick="openChat()">
    <i class="fas fa-robot"></i>
</div>

<!-- CHAT WIDGET -->
<div id="chatModal" class="chat-modal">
    <div class="chat-header">
        <h5><i class="fas fa-robot"></i> AI Assistant</h5>
        <button class="chat-close" onclick="closeChat()">×</button>
    </div>

    <div id="chat-box"></div>

    <div class="input-area">
        <input id="message" placeholder="Ask me anything..." />
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
// Background carousel
const slides = document.querySelectorAll('.bg-carousel img');
let index = 0;
setInterval(() => {
    slides[index].classList.remove('active');
    index = (index + 1) % slides.length;
    slides[index].classList.add('active');
}, 3500);

// CHAT FUNCTIONS
function openChat() {
    document.getElementById('chatModal').classList.add('active');
}
function closeChat() {
    document.getElementById('chatModal').classList.remove('active');
}

async function sendMessage() {
    let messageInput = document.getElementById("message");
    let text = messageInput.value.trim();
    if (!text) return;

    addMessage(text, "user");
    messageInput.value = "";

    const response = await fetch("/chatbot/chat/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: text})
    });

    const data = await response.json();
    addMessage(data.reply || "Error!", "bot");
}

function addMessage(text, sender) {
    const box = document.getElementById("chat-box");
    let msg = document.createElement("div");
    msg.className = "msg " + sender;
    msg.innerHTML = text.replace(/\n/g, "<br>");
    box.appendChild(msg);
    box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>
