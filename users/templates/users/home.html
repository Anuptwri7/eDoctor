{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediGuide Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: radial-gradient(ellipse at top left, #70e1f5 0%, #ffd194 75%, #f8f9fa 100%);
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
        }

        .dashboard-supercard {
            max-width: 480px;
            margin: 40px auto;
            background: rgba(255,255,255,0.91);
            border-radius: 32px;
            box-shadow: 0 8px 60px rgba(44,62,80,.18), 0 2px 8px rgba(70,225,245,0.13);
            padding: 40px 32px 32px 32px;
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        .dashboard-supercard:before {
            content:"";
            position: absolute;
            left: -60px; top: -80px;
            width: 170px; height: 170px;
            background: radial-gradient(circle, #AEE9FF88 0%, #FFC19466 70%);
            filter: blur(34px);
            z-index: 0;
        }
        .dashboard-header {
            margin-bottom: 28px;
        }
        .dashboard-header h2 {
            font-weight: 700;
            color: #038ad1;
            font-size: 2.6rem;
            margin-bottom: 0;
        }
        .dashboard-header p {
            color: #606379;
            font-size: 1.07rem;
            margin-bottom: 18px;
        }
        .dashboard-icon-group {
            margin-bottom: 16px;
        }
        .dashboard-icon-group i {
            font-size: 44px;
            margin: 0 8px;
            color: #05c46b;
            transition: color .24s;
        }
        .dashboard-supercard:hover .dashboard-icon-group i {
            color: #ff9f43;
        }
        .supercard-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 26px;
        }
        .supercard-stat {
            background: linear-gradient(120deg,#e0c3fc 0%,#8ec5fc 100%);
            border-radius: 16px;
            box-shadow: 0 3px 14px #d4e4fa44;
            padding: 18px 14px 8px 14px;
            min-width: 110px;
            flex: 1;
            margin: 0 8px;
        }
        .supercard-stat h3 {
            font-weight: 700;
            font-size: 2.2rem;
            margin-bottom: 4px;
            color: #038ad1;
        }
        .supercard-stat p {
            font-size: 1.02rem;
            color: #5c6370;
        }
        .dashboard-btn-group {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .dashboard-btn-group a {
            text-decoration: none;
        }
        .dashboard-btn-group .btn {
            padding: 14px;
            border-radius: 16px;
            font-size: 1.18rem;
            font-weight: 600;
            box-shadow: 0 2px 17px rgba(44,62,80,.12);
            transition: transform .18s, box-shadow .18s;
        }
        .dashboard-btn-group .btn-primary {
            background: linear-gradient(90deg, #4481eb 60%, #04befe 100%);
        }
        .dashboard-btn-group .btn-success {
            background: linear-gradient(90deg, #43e97b 60%, #38f9d7 100%);
        }
        .dashboard-btn-group .btn-danger {
            background: linear-gradient(90deg, #e53935 60%, #e35d5b 100%);
        }
        .dashboard-btn-group .btn i {
            margin-right: 10px;
        }
        .dashboard-btn-group .btn:hover {
            transform: scale(1.04);
            box-shadow: 0 3px 18px rgba(44,62,80,.14);
            filter: brightness(1.08);
        }
        @media (max-width:576px) {
            .dashboard-supercard {padding: 20px 4vw;}
            .supercard-stats {flex-direction: column;align-items: center;}
            .supercard-stat {margin: 6px 0;}
        }
    </style>
</head>
<body>
    <div class="dashboard-supercard">
        <div class="dashboard-header">
            <h2>MediGuide</h2>
            <p>Welcome, {{ request.user.username }}!<br>
            <span style="color:#ff9f43;">Manage your health easily and beautifully.</span></p>
        </div>
        <div class="dashboard-icon-group">
            <i class="fas fa-user-md"></i>
            <i class="fas fa-notes-medical"></i>
            <i class="fas fa-user-nurse"></i>
        </div>
        <div class="supercard-stats">
            <div class="supercard-stat">
    <a href="{% url 'checkup_list' %}" style="text-decoration:none;color:inherit;">
        <h3>{{ total_checkups }}</h3>
        <p>Total Checkups</p>
    </a>
</div>

            <div class="supercard-stat">
                <h3>{{ total_doctors }}</h3>
                <p>Available Doctors</p>
            </div>
        </div>
        <div class="dashboard-btn-group">
            <a href="{% url 'start_checkup' %}">
                <button class="btn btn-primary w-100"><i class="fas fa-notes-medical"></i>Start Checkup</button>
            </a>
            <a href="{% url 'view_doctors' %}">
                <button class="btn btn-success w-100"><i class="fas fa-user-nurse"></i>View Doctors</button>
            </a>
            <a href="{% url 'logout' %}">
                <button class="btn btn-danger w-100"><i class="fas fa-sign-out-alt"></i>Logout</button>
            </a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
