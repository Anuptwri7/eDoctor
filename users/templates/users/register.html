{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediGuide Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #aee9ff 0%, #f3f7fa 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Roboto', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.90);
            border-radius: 32px;
            box-shadow: 0 10px 42px rgba(44,62,80,.14);
            border: 1px solid rgba(120,183,255,0.13);
            padding: 38px 34px 26px 34px;
            backdrop-filter: blur(12px);
            max-width: 370px;
            width: 100%;
            position: relative;
        }
        .glass-card:before {
            content:"";
            position: absolute;
            left: -45px; top: -50px;
            width: 140px; height: 140px;
            background: radial-gradient(circle, #aee9ff90 0%, #7fbcffd0 90%);
            filter: blur(26px);
            z-index: 0;
        }
        .register-title {
            text-align: center;
            margin-bottom: 14px;
            color: #09a66f;
            font-weight: 700;
            font-size: 2.1rem;
        }
        form {
            margin-bottom: 3px;
            z-index: 2;
            position: relative;
        }
        form .form-control {
            margin-bottom: 14px;
            border-radius: 14px;
            border: 1px solid #e6f0fa;
            box-shadow: none;
        }
        button[type="submit"] {
            width: 100%;
            padding: 12px 0;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            background: linear-gradient(90deg, #43e97b 0%, #38f9d7 100%);
            color: #fff;
            border: none;
            box-shadow: 0 2px 12px rgba(44,62,80,0.08);
            transition: background .22s, transform .18s;
        }
        button[type="submit"]:hover {
            background: linear-gradient(90deg, #38f9d7 0%, #43e97b 100%);
            transform: scale(1.03);
        }
        .login-link {
            display: block;
            text-align: center;
            color: #409fff;
            margin-top: 16px;
            font-weight: 500;
            text-decoration: none;
            transition: color .2s;
        }
        .login-link:hover {
            color: #e07bfa;
        }
        .message-list p {
            font-size: 1rem;
            margin-bottom: 2px;
            text-align: center;
            color: #e53935;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h2 class="register-title">Register</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            {% if messages %}
                <div class="message-list">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
                </div>
            {% endif %}
            <button type="submit">Register</button>
        </form>
        <a class="login-link" href="{% url 'login' %}">Already have an account? Login</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
